name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: andy_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # The Microsoft.Playwright NuGet drops a playwright.ps1 install
    # script into the test project's bin folder at build time. CI needs
    # to run it once so the chromium headless_shell binary is present
    # before the E2E suite spins up a browser. Without this every test
    # in Andy.Auth.E2E.Tests fails immediately with
    # `Executable doesn't exist at /home/runner/.cache/ms-playwright/...`.
    - name: Install Playwright browsers
      run: pwsh "$(ls tests/Andy.Auth.E2E.Tests/bin/Release/*/playwright.ps1 | head -1)" install --with-deps chromium

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=andy_auth_test;Username=postgres;Password=postgres_test_password"

    - name: Pack
      run: |
        # Determine version
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(date +%Y.%m.%d)-rc.$GITHUB_RUN_NUMBER
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV

        for project in \
          src/Andy.Auth/Andy.Auth.csproj \
          src/Andy.Auth.M2MClient/Andy.Auth.M2MClient.csproj; do
          dotnet pack $project \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:PackageVersion=$VERSION
        done

    # Validate package metadata before it can be published. Guards against
    # license drift (every package must declare the repo license, Apache-2.0)
    # and against a package shipping without its readme. A .nupkg is a zip;
    # its .nuspec carries the metadata we assert on.
    - name: Validate package metadata
      run: |
        set -euo pipefail
        shopt -s nullglob
        fail=0
        for pkg in ./artifacts/*.nupkg; do
          echo "Validating $pkg"
          nuspec=$(unzip -p "$pkg" '*.nuspec')
          if ! grep -q '<license type="expression">Apache-2.0</license>' <<< "$nuspec"; then
            echo "::error file=$pkg::Missing or non-Apache-2.0 <license> in nuspec"
            fail=1
          fi
          if ! grep -q '<readme>' <<< "$nuspec"; then
            echo "::error file=$pkg::Missing <readme> in nuspec"
            fail=1
          fi
        done
        if [[ $fail -ne 0 ]]; then
          echo "Package metadata validation failed."
          exit 1
        fi
        echo "All packages declare Apache-2.0 and include a readme."

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
        retention-days: 7

  container-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build production image
      run: docker build --build-context certs=./certs -t andy-auth:ci .

    # andy-auth#126 acceptance: the image must run unprivileged and must not
    # carry build tooling into the runtime layer.
    - name: Assert the runtime user is not root
      run: |
        uid=$(docker run --rm --entrypoint sh andy-auth:ci -c 'id -u')
        echo "runtime uid: $uid"
        [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }

    - name: Assert no build tooling in the runtime image
      run: |
        for tool in curl wget git gcc dotnet-sdk; do
          if docker run --rm --entrypoint sh andy-auth:ci -c "command -v $tool" >/dev/null 2>&1; then
            echo "::error::$tool present in runtime image"; exit 1
          fi
        done

    - name: Assert persisted key path is writable by the runtime user
      run: docker run --rm --entrypoint sh andy-auth:ci -c 'touch /data/keys/.probe'

    # Health (liveness) and readiness (gated on migration + required seeding)
    # are validated against a real container, not just asserted in a unit test.
    - name: Probe health and readiness
      run: |
        docker run -d --name andy-ci -p 5000:5000 \
          -e ASPNETCORE_ENVIRONMENT=Development \
          -e ASPNETCORE_URLS=http://+:5000 \
          -e Database__Provider=Sqlite \
          -e ConnectionStrings__DefaultConnection="Data Source=/data/andy-auth.db" \
          -e OpenIddict__Issuer=http://localhost:5000/ \
          andy-auth:ci

        for i in $(seq 1 30); do
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health)" = "200" ]; then
            break
          fi
          sleep 2
        done

        health=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health)
        ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ready)
        echo "health=$health ready=$ready"
        docker logs andy-ci

        [ "$health" = "200" ] || { echo "::error::/health returned $health"; exit 1; }
        [ "$ready" = "200" ]  || { echo "::error::/ready returned $ready"; exit 1; }

    - name: Tear down
      if: always()
      run: docker rm -f andy-ci || true

  publish-prerelease:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish to NuGet
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --source ${{ env.NUGET_SOURCE }} \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish to NuGet
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --source ${{ env.NUGET_SOURCE }} \
          --api-key ${{ secrets.NUGET_API_KEY }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
